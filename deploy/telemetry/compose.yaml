# Osmia telemetry stack: OpenTelemetry Collector -> ClickHouse -> Grafana.
# See README.md. Every credential comes from the environment; the defaults
# below are for a local, loopback-only stack.
name: osmia-telemetry

x-clickhouse-credentials: &clickhouse-credentials
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-osmia}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-osmia-local}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-otel}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      <<: *clickhouse-credentials
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-otel}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      # HTTP interface for ad-hoc queries; loopback only unless overridden.
      - "${TELEMETRY_BIND:-127.0.0.1}:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The collector image has no shell and runs as an unprivileged user, so this
  # one-shot service makes the queue volume writable for it.
  collector-queue-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/var/lib/otelcol"]
    volumes:
      - collector-queue:/var/lib/otelcol
    restart: "no"

  collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      <<: *clickhouse-credentials
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000
    ports:
      # OTLP/gRPC and OTLP/HTTP; Osmia's [telemetry] endpoint points here.
      - "${TELEMETRY_BIND:-127.0.0.1}:4317:4317"
      - "${TELEMETRY_BIND:-127.0.0.1}:4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      # Holds the file_storage extension's database, which backs the sending
      # queue, so spans accepted but not yet exported survive a restart.
      - collector-queue:/var/lib/otelcol
    depends_on:
      clickhouse:
        condition: service_healthy
      collector-queue-init:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read by grafana/provisioning/datasources/clickhouse.yaml.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-osmia}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-osmia-local}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-otel}
    ports:
      - "${TELEMETRY_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  collector-queue:
  grafana-data:
