apiVersion: 1

# Points Grafana at the Compose ClickHouse. Credentials are interpolated from
# the Grafana container's environment (see compose.yaml).
datasources:
  - name: Osmia ClickHouse
    uid: osmia-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: ${CLICKHOUSE_DATABASE}
      defaultTable: otel_traces
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
