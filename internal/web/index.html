<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Osmia</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body data-connection="connecting">
<header class="bar">
  <h1>Osmia</h1>
  <span id="connection" role="status">Connecting…</span>
</header>
<main>
  <section id="problems" class="problems" aria-label="Problems" hidden>
    <ul id="problem-list"></ul>
  </section>
  <section aria-labelledby="pauses-title">
    <h2 id="pauses-title">Pauses</h2>
    <ul id="pause-list" class="pauses"></ul>
  </section>
  <section aria-labelledby="capacity-title">
    <h2 id="capacity-title">Capacity</h2>
    <div id="capacity" class="capacity"></div>
  </section>
  <section aria-labelledby="work-title">
    <h2 id="work-title">Active work</h2>
    <div id="workstreams" class="workstreams"></div>
  </section>
</main>
</body>
</html>
