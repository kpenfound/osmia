# Dagger workspace configuration
# Install modules with: dagger module install <module>

[modules]

[modules.go]
source = "dagger.io/go"

[modules.go.settings]
base = "dag://osmia-dev/test-runtime"
# -count=1 keeps go test from recording every file the tests touch for its
# result cache and reading that log back after each package: the service
# tests' log outgrows the engine's memory.
goflags = "-count=1 -timeout=30m"
# Keep factory state and local agent worktrees out of module discovery,
# including any go.mod files left in session directories. The web-driver module
# and the verification fixture are Dagger modules whose SDK code the engine
# generates when it loads them, so the Go checks skip them; the
# web-driver-fixture check exercises them.
test = ["**", "!.bees", "!.claude", "!modules/web-driver", "!testdata/verification-fixture"]
generate = ["**", "!.bees/**", "!.claude/**", "!modules/web-driver/**", "!testdata/verification-fixture/**", "!modules/web-driver", "!testdata/verification-fixture"]

[modules.release]
source = ".dagger/modules/osmia-release"

[modules.dang-sdk]
source = "dagger.io/sdk/dang"

[sdks.dang]
module = "dang-sdk"

[modules.osmia-dev]
source = ".dagger/modules/osmia-dev"
main = true

[sdks.dang.scopes.".dagger/modules/osmia-dev"]
is-module = true
name = "osmia-dev"

# dagger check --env=race runs the selected tests with the race detector.
[env.race.modules.go.settings]
goflags = "-count=1 -timeout=30m -race"

# dagger check --env=flake runs each selected test five times.
[env.flake.modules.go.settings]
goflags = "-count=5 -timeout=30m"

[modules.staticcheck]
source = "dagger.io/go/staticcheck"

[modules.staticcheck.settings]
# The web-driver module and the verification fixture generate their SDK code
# when the engine loads them, so lint skips them. Each has its own
# staticcheck.conf so that it is a separate project the root project leaves out;
# the web-driver-fixture check exercises them.
lint = ["**", "!.bees", "!.claude", "!modules/web-driver", "!testdata/verification-fixture"]
